[project]
name = "phc-workspace"
version = "0.1.0"
description = "Photonic Crystal and Integrated Photonics Design & Simulation Workspace"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "gdstk>=0.9.0",
    "matplotlib>=3.8.0",
]


[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "packages/phc_hydra/src",
    "packages/phc_layout/src",
    "packages/phc_materials/src",
    "packages/phc_mpb/src",
    "packages/phc_optimization/src",
    "packages/phc_utils/src",
]
addopts = "--import-mode=importlib"
markers = [
    "integration: End-to-end integration tests connecting multiple packages",
    "slow: Long-running electromagnetic simulation tests",
]


