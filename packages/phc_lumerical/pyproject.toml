[project]
name = "phc-lumerical"
version = "0.1.0"
description = "Ansys Lumerical FDTD/MODE simulation automation and GDS import for Photonic Crystals"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "phc-materials",
    "phc-layout",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
