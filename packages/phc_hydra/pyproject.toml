[project]
name = "phc-hydra"
version = "0.1.0"
description = "Hydra configuration coordination, output hierarchy management, and artifact tracking for phc"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "phc-utils>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
