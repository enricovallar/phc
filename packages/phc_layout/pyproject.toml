[project]
name = "phc-layout"
version = "0.1.0"
description = "Photonic crystal layout generation tools based on gdsfactory"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gdsfactory>=8.0.0",
    "shapely>=2.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
