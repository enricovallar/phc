[project]
name = "phc_optimization"
version = "0.1.0"
description = "Modular Bayesian Optimization and Target Objective Framework for Photonic Crystals"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "phc_layout",
    "phc_materials",
    "phc_mpb",
    "phc_hydra",
    "phc_utils",
    "scikit-optimize>=0.10.2",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
